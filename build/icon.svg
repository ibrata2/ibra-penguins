<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a7fd4"/>
      <stop offset="0.55" stop-color="#7cc8f2"/>
      <stop offset="1" stop-color="#d9f2ff"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b0"/>
      <stop offset="0.35" stop-color="#d4af37"/>
      <stop offset="0.7" stop-color="#8a6410"/>
      <stop offset="1" stop-color="#ffe08a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a5878"/>
      <stop offset="0.5" stop-color="#1b2236"/>
      <stop offset="1" stop-color="#0a0d16"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d3e2f2"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc24a"/>
      <stop offset="1" stop-color="#e2700a"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8fd0ee"/>
    </linearGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4d5e"/>
      <stop offset="1" stop-color="#b3132a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect x="40" y="40" width="944" height="944" rx="210"/></clipPath>
  </defs>

  <!-- gold rim + tile -->
  <rect x="16" y="16" width="992" height="992" rx="230" fill="url(#rim)"/>
  <rect x="40" y="40" width="944" height="944" rx="210" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <circle cx="512" cy="330" r="430" fill="url(#glow)"/>
    <!-- mountains -->
    <path d="M40 700 L230 470 L340 590 L520 380 L700 600 L820 500 L984 690 L984 984 L40 984 Z" fill="#b8def3" opacity="0.8"/>
    <path d="M230 470 L280 530 L250 520 L215 545 L195 515 Z M520 380 L580 450 L540 440 L505 470 L470 440 Z" fill="#ffffff"/>
    <!-- ice floor -->
    <path d="M40 820 Q300 770 512 790 T984 800 L984 984 L40 984 Z" fill="url(#ice)"/>
    <path d="M40 870 L984 870 M40 930 L984 930 M220 820 L220 870 M520 790 L520 870 M800 805 L800 870 M380 870 L380 930 M660 870 L660 930" stroke="#7bbfe0" stroke-width="6" opacity="0.6"/>
    <!-- snowflakes -->
    <g fill="#ffffff" opacity="0.9">
      <circle cx="150" cy="200" r="10"/><circle cx="860" cy="170" r="12"/><circle cx="800" cy="360" r="8"/><circle cx="210" cy="420" r="7"/><circle cx="900" cy="560" r="9"/><circle cx="120" cy="620" r="8"/>
    </g>
  </g>

  <!-- penguin -->
  <ellipse cx="512" cy="878" rx="230" ry="34" fill="#0b2a44" opacity="0.25"/>
  <g transform="translate(512 560)">
    <!-- feet -->
    <ellipse cx="-90" cy="310" rx="88" ry="34" fill="#f39a1e" stroke="#a85a06" stroke-width="8"/>
    <ellipse cx="90" cy="310" rx="88" ry="34" fill="#f39a1e" stroke="#a85a06" stroke-width="8"/>
    <!-- body -->
    <ellipse cx="0" cy="80" rx="250" ry="260" fill="url(#body)"/>
    <!-- flippers -->
    <path d="M-235 20 Q-330 140 -280 250 Q-240 190 -205 120 Z" fill="#141a29"/>
    <path d="M235 20 Q330 140 280 250 Q240 190 205 120 Z" fill="#141a29"/>
    <!-- belly -->
    <ellipse cx="0" cy="130" rx="170" ry="200" fill="url(#belly)"/>
    <!-- head -->
    <circle cx="0" cy="-170" r="215" fill="url(#body)"/>
    <!-- face -->
    <path d="M0 -90 C-60 -160 -175 -150 -170 -55 C-165 40 -60 60 0 30 C60 60 165 40 170 -55 C175 -150 60 -160 0 -90 Z" fill="#ffffff"/>
    <!-- eyes -->
    <ellipse cx="-78" cy="-80" rx="42" ry="50" fill="#10131c"/>
    <ellipse cx="78" cy="-80" rx="42" ry="50" fill="#10131c"/>
    <circle cx="-62" cy="-98" r="16" fill="#ffffff"/>
    <circle cx="94" cy="-98" r="16" fill="#ffffff"/>
    <circle cx="-88" cy="-62" r="7" fill="#ffffff" opacity="0.8"/>
    <circle cx="68" cy="-62" r="7" fill="#ffffff" opacity="0.8"/>
    <!-- cheeks -->
    <ellipse cx="-128" cy="-10" rx="30" ry="16" fill="#ff7a8c" opacity="0.55"/>
    <ellipse cx="128" cy="-10" rx="30" ry="16" fill="#ff7a8c" opacity="0.55"/>
    <!-- beak -->
    <path d="M-52 -18 Q0 -45 52 -18 Q30 40 0 46 Q-30 40 -52 -18 Z" fill="url(#beak)" stroke="#a85a06" stroke-width="6"/>
    <path d="M-30 -14 Q0 -28 30 -14" stroke="#fff" stroke-width="7" fill="none" opacity="0.5" stroke-linecap="round"/>
    <!-- scarf -->
    <path d="M-205 40 Q0 120 205 40 L205 110 Q0 190 -205 110 Z" fill="url(#scarf)"/>
    <path d="M120 90 L180 260 L95 250 L60 100 Z" fill="url(#scarf)"/>
    <path d="M-200 70 Q0 150 200 70" stroke="#ffffff" stroke-width="10" fill="none" opacity="0.8"/>
    <path d="M105 240 L180 250 M95 215 L170 225" stroke="#ffffff" stroke-width="8" opacity="0.8"/>
    <!-- gold crown -->
    <path d="M-110 -330 L-130 -440 L-60 -380 L0 -470 L60 -380 L130 -440 L110 -330 Z" fill="#d4af37" stroke="#7a5608" stroke-width="10" stroke-linejoin="round"/>
    <path d="M-110 -330 L110 -330 L105 -300 L-105 -300 Z" fill="#b8901c" stroke="#7a5608" stroke-width="8"/>
    <circle cx="0" cy="-470" r="16" fill="#fff3b0"/><circle cx="-130" cy="-440" r="13" fill="#fff3b0"/><circle cx="130" cy="-440" r="13" fill="#fff3b0"/>
    <circle cx="0" cy="-358" r="18" fill="#e0245e"/>
    <path d="M-100 -390 L-60 -380" stroke="#fff6c8" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
